<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="svg-pal pal-stickers" role="img" aria-label="Confetti, animated character"><style>
.svg-pal .pal-body{transform-origin:60px 65px;animation:pal-breathe 6s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
.svg-pal .pal-eyes{transform-origin:60px 53px;animation:pal-blink 11s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
.svg-pal .pal-pupils{animation:pal-look 14s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
.svg-pal .pal-smile{transform-origin:62px 77px;animation:pal-smile 14s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
.svg-pal .pal-grin{opacity:0;animation:pal-grin 14s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
.svg-pal .pal-cheeks{opacity:0;animation:pal-cheeks 14s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
@keyframes pal-breathe{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-2px) rotate(1deg)}}
@keyframes pal-look{0%,7%,94%,100%{transform:translate(0,0)}12%,23%{transform:translate(3.5px,0)}28%,39%{transform:translate(-3.5px,0)}44%,55%{transform:translate(0,-3.5px)}60%,70%{transform:translate(0,3.5px)}76%,89%{transform:translate(0,0)}}
@keyframes pal-blink{0%,19%,21%,61%,63%,100%{transform:scaleY(1)}20%,62%{transform:scaleY(.08)}}
@keyframes pal-smile{0%,70%,96%,100%{opacity:1;transform:scaleY(1)}77%,89%{opacity:0;transform:scaleY(1.3)}}
@keyframes pal-grin{0%,70%,96%,100%{opacity:0}77%,89%{opacity:1}}
@keyframes pal-cheeks{0%,70%,96%,100%{opacity:0}77%,89%{opacity:.3}}
.svg-pal[data-state="thinking"] .pal-body{animation:pal-ponder 3s ease-in-out infinite}
.svg-pal[data-state="working"] .pal-body{animation:pal-work 1.6s ease-in-out infinite}
.svg-pal[data-state="success"] .pal-body{animation:pal-celebrate .6s ease-in-out 1}
.svg-pal[data-state="error"] .pal-body{animation:pal-shake .4s ease-in-out 1}
@keyframes pal-ponder{50%{transform:rotate(-5deg)}}
@keyframes pal-work{50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes pal-celebrate{35%{transform:translateY(-7px) rotate(-4deg)}70%{transform:translateY(-2px) rotate(3deg)}}
@keyframes pal-shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.svg-pal.pal-heads .pal-eyes,.svg-pal.pal-dots .pal-eyes{transform-box:fill-box;transform-origin:center}
.svg-pal.pal-heads .pal-smile{transform-box:fill-box;transform-origin:center}
.svg-pal .pal-prop{transform-origin:25px 110px;animation:pal-wave 6s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
@keyframes pal-wave{0%,60%,100%{transform:rotate(0)}70%,85%{transform:rotate(-8deg)}77%,92%{transform:rotate(4deg)}}
.svg-pal .pal-symbol{transform-origin:60px 60px;animation:pal-symbol 5s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
.svg-pal .pal-clock{transform-origin:60px 60px;animation:pal-clock 16s linear infinite}
@keyframes pal-symbol{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.04)}}
@keyframes pal-clock{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.svg-pal .pal-symbol,.svg-pal .pal-clock,.svg-pal .pal-prop,.svg-pal .pal-body,.svg-pal .pal-eyes,.svg-pal .pal-pupils,.svg-pal .pal-smile,.svg-pal .pal-grin,.svg-pal .pal-cheeks{animation:none!important}}
</style><g class="pal-body"><g class="pal-symbol"><path d="M16 78Q21 51 33 57Q45 66 35 73Q22 84 42 91" fill="none" stroke="#43C647" stroke-width="7" stroke-linecap="round"/><path d="M60 18Q53 39 74 37Q92 37 88 58" fill="none" stroke="#9287f0" stroke-width="7" stroke-linecap="round"/><circle cx="26" cy="26" r="6" fill="#ff7745"/><circle cx="84" cy="91" r="6" fill="#cf4cf0"/><path d="M53 57L59 68L72 69L62 78L65 91L53 84L42 90L45 77L36 68L49 67Z" fill="#ffd34b" /><path d="M103 48L105 58" fill="none" stroke="#ffd34b" stroke-width="5" stroke-linecap="round"/></g></g></svg>