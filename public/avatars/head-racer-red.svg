<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="svg-pal pal-heads" role="img" aria-label="Cherry Racer, animated character"><style>
.svg-pal .pal-body{transform-origin:60px 65px;animation:pal-breathe 6s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
.svg-pal .pal-eyes{transform-origin:60px 53px;animation:pal-blink 11s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
.svg-pal .pal-pupils{animation:pal-look 14s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
.svg-pal .pal-smile{transform-origin:62px 77px;animation:pal-smile 14s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
.svg-pal .pal-grin{opacity:0;animation:pal-grin 14s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
.svg-pal .pal-cheeks{opacity:0;animation:pal-cheeks 14s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
@keyframes pal-breathe{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-2px) rotate(1deg)}}
@keyframes pal-look{0%,7%,94%,100%{transform:translate(0,0)}12%,23%{transform:translate(3.5px,0)}28%,39%{transform:translate(-3.5px,0)}44%,55%{transform:translate(0,-3.5px)}60%,70%{transform:translate(0,3.5px)}76%,89%{transform:translate(0,0)}}
@keyframes pal-blink{0%,19%,21%,61%,63%,100%{transform:scaleY(1)}20%,62%{transform:scaleY(.08)}}
@keyframes pal-smile{0%,70%,96%,100%{opacity:1;transform:scaleY(1)}77%,89%{opacity:0;transform:scaleY(1.3)}}
@keyframes pal-grin{0%,70%,96%,100%{opacity:0}77%,89%{opacity:1}}
@keyframes pal-cheeks{0%,70%,96%,100%{opacity:0}77%,89%{opacity:.3}}
.svg-pal[data-state="thinking"] .pal-body{animation:pal-ponder 3s ease-in-out infinite}
.svg-pal[data-state="working"] .pal-body{animation:pal-work 1.6s ease-in-out infinite}
.svg-pal[data-state="success"] .pal-body{animation:pal-celebrate .6s ease-in-out 1}
.svg-pal[data-state="error"] .pal-body{animation:pal-shake .4s ease-in-out 1}
@keyframes pal-ponder{50%{transform:rotate(-5deg)}}
@keyframes pal-work{50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes pal-celebrate{35%{transform:translateY(-7px) rotate(-4deg)}70%{transform:translateY(-2px) rotate(3deg)}}
@keyframes pal-shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.svg-pal.pal-heads .pal-eyes,.svg-pal.pal-dots .pal-eyes{transform-box:fill-box;transform-origin:center}
.svg-pal.pal-heads .pal-smile{transform-box:fill-box;transform-origin:center}
.svg-pal .pal-prop{transform-origin:25px 110px;animation:pal-wave 6s ease-in-out infinite;animation-delay:var(--pal-delay,0s)}
@keyframes pal-wave{0%,60%,100%{transform:rotate(0)}70%,85%{transform:rotate(-8deg)}77%,92%{transform:rotate(4deg)}}
@media(prefers-reduced-motion:reduce){.svg-pal .pal-prop,.svg-pal .pal-body,.svg-pal .pal-eyes,.svg-pal .pal-pupils,.svg-pal .pal-smile,.svg-pal .pal-grin,.svg-pal .pal-cheeks{animation:none!important}}
</style><g class="pal-body"><path d="M22 45Q12 74 27 99Q55 116 86 102L102 88L104 43Z" fill="#c92855" stroke="#202020" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 100L35 108L78 108L79 90" fill="#FFA58E" /><path d="M35 98L35 108M79 90L79 108" fill="none" stroke="#202020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 44Q29 32 51 33L78 36Q92 39 94 58Q110 50 108 67Q108 79 92 81Q87 96 70 100Q41 108 27 89Q23 77 25 57Z" fill="#FFA58E" stroke="#202020" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M93 67L100 63" fill="none" stroke="#202020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><g class="pal-eyes"><g class="pal-pupils"><ellipse cx="43" cy="62" rx="2.6" ry="3.6" fill="#171717" /><ellipse cx="64" cy="62" rx="2.6" ry="3.6" fill="#171717" /></g></g><path d="M38 49Q42 46 46 49M59 49Q63 46 67 49" fill="none" stroke="#202020" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="pal-smile"><path d="M48 79Q52 84 57 79" fill="none" stroke="#202020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><g class="pal-grin"><path d="M45 77Q53 83 62 76Q63 85 54 88Q46 88 45 77Z" fill="#fff" stroke="#202020" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M49 85L59 83" fill="none" stroke="#f09087" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g class="pal-cheeks"><ellipse cx="35" cy="75" rx="5" ry="2.4" fill="#ef6e78" /><ellipse cx="74" cy="74" rx="5" ry="2.4" fill="#ef6e78" /></g><path d="M17 47Q25 7 61 9Q92 10 106 48L108 79L84 76L81 51Q47 39 17 47Z" fill="#cd2454" stroke="#202020" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 26Q52 11 67 11L80 15L63 26L49 28L31 42L24 42Z" fill="#f5ecdc" stroke="#202020" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M81 51L108 65" fill="none" stroke="#202020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M89 59Q103 59 95 79L84 88L83 72Z" fill="#f3eddf" stroke="#202020" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 81Q68 103 50 105" fill="none" stroke="#202020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>